# CI offload kit: THIS project's values (ci/offload-2, 2026-11-13). Sourced by tools/ci/offload.sh and
# tools/install-build.sh. Everything project-specific lives here; the scripts and the reusable workflows are generic.
# Any value can be overridden from the environment (CI_REPO=... tools/ci/offload.sh ...).
: "${CI_REPO:=wilsonguenther-dev/critical-mass-unity}"     # owner/name on GitHub
: "${CI_WORKFLOW_REF:=main}"                               # branch whose workflow files are dispatched (builds any ref)
: "${CI_UNITY_WORKFLOW:=unity-build.yml}"                  # thin caller of reusable-unity-build.yml
: "${CI_BLENDER_WORKFLOW:=blender.yml}"                    # thin caller of reusable-blender.yml
: "${CI_INPUTS_TAG:=ci-inputs}"                            # DRAFT release that carries input bundles (not public)
: "${CI_POLL_SECONDS:=120}"                                # ~/cm-incidents/LOW-CHURN-NOTICE.md: never faster than 120 s
: "${CI_MAX_WAIT_MIN:=90}"
: "${CI_OUT_ROOT:=$HOME/cm-ci-out}"                        # default download root (outside every checkout)
: "${CI_LOG_FILE:=}"                                       # optional JSONL log (loop/gates/remote sets loop/logs/gates.jsonl)
# Players
: "${CI_MAC_APP:=CriticalMass.app}"                        # .app name the build method writes
: "${CI_MAC_PROCESS:=Critical Mass}"                       # process name while it runs (CFBundleName)
: "${CI_INSTALL_DIR:=$HOME/critical-mass-unity/Builds}"    # where integrators install the current build
: "${CI_STAMP_FILE:=Contents/Resources/Data/resources.assets}"   # holds the BuildInfo stamp text (version=, commit=)
# Play-test box (second Mac)
: "${CI_PLAYTEST_HOST:=wilsons-macbook-air.local}"
: "${CI_PLAYTEST_CMD:=tools/remote-playtest.sh}"           # called as: CMD --host H --app APP --mode M --out DIR
