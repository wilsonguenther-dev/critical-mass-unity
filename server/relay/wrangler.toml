# Critical Mass room relay: one Cloudflare Worker plus one Durable Object per room. Free plan only (SQLite-backed Durable
# Objects are the ones the Workers Free plan allows). No secrets, no account id in this file: `wrangler deploy` uses the
# account you are logged in to. See README.md.
name = "cm-rooms"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# b15-zero-cost: today's cost counter (GET /usage).
[[durable_objects.bindings]]
name = "USAGE"
class_name = "Usage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Usage"]

# b15-zero-cost: Workers Logs on, free on the Workers Free plan (200,000 log events a day, 3 days kept:
# https://developers.cloudflare.com/workers/observability/logs/workers-logs/). Every WebSocket message is an invocation,
# so only 1 in 100 is logged (errors and kicks still show up over a day). Request counts do not need logs: GET /usage and
# tools/online/relay-usage.py read them.
[observability]
enabled = true
head_sampling_rate = 0.01

# b17-harden (not deployed by the builder; see server/relay/README.md "b17"): per-IP limits checked in the Worker before
# any Durable Object request. Workers Rate Limiting binding (https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/,
# GA 2025-09; needs wrangler 4.36+; approximate, per Cloudflare location). Whether the Free plan accepts it is not stated
# on that page: if `wrangler deploy` refuses these blocks, delete them; src/index.js then uses its in-memory fallback.
[[ratelimits]]
name = "CREATE_LIMIT"
namespace_id = "17001"
  [ratelimits.simple]
  limit = 3
  period = 60

[[ratelimits]]
name = "JOIN_LIMIT"
namespace_id = "17002"
  [ratelimits.simple]
  limit = 60
  period = 60

[[ratelimits]]
name = "MSG_LIMIT"
namespace_id = "17003"
  [ratelimits.simple]
  limit = 9000
  period = 60
