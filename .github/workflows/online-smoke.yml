# online-rooms-2: the online room end to end with no Unity and no account.
# Job "local-relay": starts the room relay (server/relay) on the runner itself with `wrangler dev` (a local copy of the
# Worker and its Durable Object; no Cloudflare login), then two console peers (tools/online/HeadlessPeer: the game's own
# Sim and lockstep code) host and join a room by code over real WebSockets, play 1800 ticks with autopilot humans and
# write per-tick fingerprints; the job fails if one fingerprint differs.
# Job "cross-os" (manual, after the relay is deployed): host on Windows, joiner on macOS, through the deployed relay
# (repository variable CM_RELAY_URL), so the two runtimes and two operating systems must agree bit for bit.
name: online-smoke
on:
  push:
    branches: ['feat/online-rooms-*', 'ci/**']   # b15 branches: run by hand (workflow_dispatch), each run spends relay allowance only in cross-os
    paths:
      - 'Assets/_Game/Net/**'
      - 'Assets/_Game/Sim/**'
      - 'server/relay/**'
      - 'tools/online/**'
      - '.github/workflows/online-smoke.yml'
  workflow_dispatch:
    inputs:
      cross_os:
        description: "also run host on Windows and joiner on macOS through the deployed relay (needs vars.CM_RELAY_URL)"
        type: boolean
        default: false
      ticks:
        description: "ticks to play"
        default: '1800'
      drop_rejoin:
        description: "b15-rejoin: TICK:MS = the joiner drops with no goodbye at TICK, comes back MS later, replays the match and takes its fighter back; its rejoined fingerprints must MATCH the host's ('' = off)"
        default: ''
      crossplay_mode:
        description: "b12-w: run .github/workflows/crossplay.yml instead of the local pair (none | players | console | mixed | mac_host_external)"
        type: choice
        options: [none, players, console, mixed, mac_host_external]
        default: none
      unity_ci_run_id:
        description: "crossplay: the unity-ci run whose players to use"
        default: ''
      room_code:
        description: "crossplay mac_host_external: the room code the external host shows"
        default: ''
permissions:
  contents: read
concurrency:
  group: online-smoke-${{ github.ref }}-${{ inputs.crossplay_mode || 'none' }}
  cancel-in-progress: true
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  WRANGLER_SEND_METRICS: 'false'
jobs:
  local-relay:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.crossplay_mode == 'none' || inputs.crossplay_mode == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Relay unit tests
        working-directory: server/relay
        run: node --test test/protocol.test.js
      - name: Build the console peer
        run: dotnet build tools/online/HeadlessPeer -c Release -nologo -clp:ErrorsOnly
      - name: Start the relay locally
        working-directory: server/relay
        run: |
          npx --yes wrangler@4 dev --local --port 8787 --ip 127.0.0.1 > "$RUNNER_TEMP/relay.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8787/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8787/health || { cat "$RUNNER_TEMP/relay.log"; exit 1; }
      - name: Host and join a room, play, compare fingerprints
        run: |
          set -u
          T="${{ inputs.ticks || '1800' }}"
          P=tools/online/HeadlessPeer/bin/Release/net8.0/cm-online-peer.dll
          R=http://127.0.0.1:8787
          mkdir -p out
          dotnet $P -host -relay $R -humans 2 -ticks $T -teamsize 16 -name Host -hash-log out/host.txt -code-out out/code.txt -timeout 600 -lobby 120 -chat-at 300 -chat-text "b17 hello from the host" > out/host.log 2>&1 &
          HP=$!
          # code.txt is written only once the host's own connection is in the room ("ROOM READY"), so the joiner never races it.
          for i in $(seq 1 60); do [ -s out/code.txt ] && break; sleep 1; done
          CODE=$(cat out/code.txt)
          echo "room code $CODE"
          DR="${{ inputs.drop_rejoin || '' }}"
          DROP=""; RJ=0
          if [ -n "$DR" ]; then DROP="-drop-at ${DR%%:*} -rejoin-after ${DR##*:}"; RJ=1; fi
          dotnet $P -join "$CODE" -relay $R -ticks $T -name Joiner -team crimson -class Miner -hash-log out/join.txt -timeout 600 $DROP -chat-at 150 -chat-text "b17 hello from the joiner" -callout-at 180 -callout-id 7 > out/join.log 2>&1
          JC=$?
          wait $HP; HC=$?
          cat out/host.log out/join.log
          echo "host exit $HC, joiner exit $JC"
          python3 tools/online/compare-hashes.py out/host.txt out/join.txt --min $(( T / 30 - 2 )) || exit 1
          if [ $RJ -eq 1 ]; then
            D=${DR%%:*}
            # b15-rejoin: the rejoined session (replayed from tick 0, then live) against the host, past the drop.
            python3 tools/online/compare-hashes.py out/host.txt out/join.txt.rejoin --min $(( (T - D) / 30 - 4 )) --from $(( D + 60 )) || exit 1
          fi
          grep -h "ONLINE TRAFFIC" out/host.log out/join.log || true
          # b17-chat: a chat line each way and a callout ride the room connection (and the fingerprints above still match)
          bash tools/online/chat-check.sh out/host.log out/join.log "${DR%%:*}" || exit 1
          [ $HC -eq 0 ] && [ $JC -eq 0 ]
      - name: b15-zero-cost, direct play (no relay), fallback to the relay, and the relay's usage count
        run: |
          set -u
          P=tools/online/HeadlessPeer/bin/Release/net8.0/cm-online-peer.dll
          R=http://127.0.0.1:8787
          T=900
          # 1. Direct only: the host listens on TCP 47800, the joiner types 127.0.0.1:47800; no relay, no code.
          dotnet $P -host -no-relay -direct-port 47800 -humans 2 -ticks $T -name Host -hash-log out/dhost.txt -code-out out/dcode.txt -timeout 300 -lobby 90 > out/dhost.log 2>&1 &
          HP=$!
          for i in $(seq 1 60); do [ -s out/dcode.txt ] && break; sleep 1; done
          dotnet $P -direct 127.0.0.1:47800 -ticks $T -name Joiner -team crimson -class Miner -hash-log out/djoin.txt -timeout 300 > out/djoin.log 2>&1
          JC=$?; wait $HP; HC=$?
          cat out/dhost.log out/djoin.log
          echo "direct: host exit $HC, joiner exit $JC"
          python3 tools/online/compare-hashes.py out/dhost.txt out/djoin.txt --min $(( T / 30 - 2 )) || exit 1
          grep -q "path direct" out/djoin.log || { echo "the joiner did not play direct"; exit 1; }
          [ $HC -eq 0 ] && [ $JC -eq 0 ] || exit 1
          # 2. Fallback: the host takes relay and direct joiners (port 47810); the joiner is given a port where nothing
          #    listens AND the room code: it must fall back to the relay room and MATCH.
          rm -f out/fcode.txt
          dotnet $P -host -relay $R -direct-port 47810 -humans 2 -ticks $T -name Host -hash-log out/fhost.txt -code-out out/fcode.txt -timeout 300 -lobby 90 > out/fhost.log 2>&1 &
          HP=$!
          for i in $(seq 1 60); do [ -s out/fcode.txt ] && break; sleep 1; done
          CODE=$(cat out/fcode.txt)
          dotnet $P -join "$CODE" -direct 127.0.0.1:47899 -relay $R -ticks $T -name Joiner -team crimson -hash-log out/fjoin.txt -timeout 300 > out/fjoin.log 2>&1
          JC=$?; wait $HP; HC=$?
          cat out/fhost.log out/fjoin.log
          echo "fallback: host exit $HC, joiner exit $JC"
          python3 tools/online/compare-hashes.py out/fhost.txt out/fjoin.txt --min $(( T / 30 - 2 )) || exit 1
          grep -q "path relay" out/fjoin.log || { echo "the joiner did not fall back to the relay"; exit 1; }
          [ $HC -eq 0 ] && [ $JC -eq 0 ] || exit 1
          # 3. The relay's own count of today's cost (GET /usage), after the rooms above closed.
          sleep 2
          U=$(curl -sf $R/usage) || { echo "no /usage"; exit 1; }
          echo "relay usage: $U"
          echo "$U" | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["messages"] > 0 and d["requests"] > 0 and d["free"] == 100000, d; print("USAGE OK", d["messages"], "messages,", d["requests"], "requests counted")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-smoke-local
          path: |
            out/
            ${{ runner.temp }}/relay.log
          if-no-files-found: ignore
          retention-days: 7

  # b12-w: the cross-OS pair, fixed. Its only run (43627866241, 2026-11-14) failed because a separate job made the room
  # and the two runners raced: the macOS joiner connected 9 s before the Windows host and heard "no room with that
  # code" (that build did not retry), then the host waited 15 minutes for nobody (exit 4). Now the Windows host makes
  # the room itself right before it connects and uploads the code as an artifact; the macOS joiner waits for that
  # artifact (tools/online/wait-room.sh) and joins with retries. The same pair, plus the built players, is
  # .github/workflows/crossplay.yml (mode console / players).
  cross-os:
    if: ${{ inputs.cross_os && vars.CM_RELAY_URL != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, role: host }
          - { os: macos-latest, role: join }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELAY: ${{ vars.CM_RELAY_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet build tools/online/HeadlessPeer -c Release -nologo -clp:ErrorsOnly
      - name: Make the room (host) and publish its code
        if: matrix.role == 'host'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p room
          J=$(curl -sf -X POST "$RELAY/rooms")
          echo "$J" | python -c 'import sys,json;d=json.load(sys.stdin);open("room/room.txt","w",newline="\n").write("code="+d["code"]+"\nnetbuild=headless\n");open(sys.argv[1],"w").write(d["key"])' "$RUNNER_TEMP/room-key.txt"
          cat room/room.txt
      - uses: actions/upload-artifact@v4
        if: matrix.role == 'host'
        with: { name: cross-os-room, path: room/room.txt, retention-days: 1 }
      - name: Wait for the host's room (joiner)
        if: matrix.role == 'join'
        shell: bash
        run: bash tools/online/wait-room.sh cross-os-room room 1500
      - name: Play
        shell: bash
        timeout-minutes: 35
        run: |
          set +e -uo pipefail
          P=tools/online/HeadlessPeer/bin/Release/net8.0/cm-online-peer.dll
          T="${{ inputs.ticks || '1800' }}"
          CODE=$(sed -n 's/^code=//p' room/room.txt)
          if [ "${{ matrix.role }}" = host ]; then
            dotnet $P -host -code "$CODE" -key "$(cat "$RUNNER_TEMP/room-key.txt")" -relay "$RELAY" -humans 2 -ticks $T -hash-log hashes.txt -lobby 540 -timeout 1800 -chat-at 300 -chat-text "b17 hello from the host" 2>&1 | tee peer.log
          else
            DR="${{ inputs.drop_rejoin || '' }}"
            DROP=""
            if [ -n "$DR" ]; then DROP="-drop-at ${DR%%:*} -rejoin-after ${DR##*:}"; fi
            dotnet $P -join "$CODE" -relay "$RELAY" -ticks $T -team crimson -hash-log hashes.txt -timeout 1800 -join-tries 80 $DROP -chat-at 150 -chat-text "b17 hello from the joiner" -callout-at 180 -callout-id 7 2>&1 | tee peer.log
          fi
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'hashes-${{ matrix.role }}'
          path: |
            hashes.txt
            hashes.txt.rejoin
            peer.log
  cross-os-compare:
    needs: cross-os
    if: ${{ always() && inputs.cross_os }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false, sparse-checkout: tools/online }
      - uses: actions/download-artifact@v4
      - run: |
          set +e
          python3 tools/online/crossplay-check.py hashes-host/peer.log hashes-join/peer.log --names host,join
          python3 tools/online/compare-hashes.py hashes-host/hashes.txt hashes-join/hashes.txt --min $(( ${{ inputs.ticks || '1800' }} / 30 - 2 )) || exit 1
          DR="${{ inputs.drop_rejoin || '' }}"
          # b17-chat: the Windows host and the macOS joiner exchanged a chat line and a callout through the relay
          bash tools/online/chat-check.sh hashes-host/peer.log hashes-join/peer.log "${DR%%:*}" || exit 1
          if [ -n "$DR" ]; then
            T="${{ inputs.ticks || '1800' }}"; D=${DR%%:*}
            grep -E "ONLINE (DROPPED|REJOINING|REJOINED|TOHUMAN|TOBOT)" hashes-join/peer.log hashes-host/peer.log || true
            # b15-rejoin: Windows host vs the macOS joiner's rejoined session, past the drop.
            python3 tools/online/compare-hashes.py hashes-host/hashes.txt hashes-join/hashes.txt.rejoin --min $(( (T - D) / 30 - 4 )) --from $(( D + 60 )) || exit 1
          fi

  # b12-w: Windows player against Mac player (and the other cross-play modes), see crossplay.yml.
  crossplay:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.crossplay_mode != 'none' && inputs.crossplay_mode != '' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/crossplay.yml
    with:
      mode: ${{ inputs.crossplay_mode }}
      unity_ci_run_id: ${{ inputs.unity_ci_run_id }}
      ticks: ${{ inputs.ticks || '1800' }}
      room_code: ${{ inputs.room_code }}
