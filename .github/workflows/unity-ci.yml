# ci/offload (2026-11-13): Unity EditMode, PlayMode and player builds on GitHub's Linux runners with GameCI
# (https://game.ci), so agents stop queueing on the one Unity slot of the owner's Mac. Images: unityci/editor
# ubuntu-6000.3.28f1-{base,windows-mono,mac-mono}-3 (published 2026-11-03). The project is Mono (scriptingBackend
# Standalone 0), so the Windows and macOS players cross-build from Linux; the macOS app is unsigned.
#
# Licence: needs EITHER the repository secret UNITY_LICENSE (the .ulf file's contents) OR both UNITY_EMAIL and
# UNITY_PASSWORD (Unity Personal, https://game.ci/docs/github/activation). The game-ci CLI that unity-test-runner@v4 and
# unity-builder@v4 shell out to resolves file mode whenever a .ulf is present and no serial is set
# (game-ci/cli dist/platforms/ubuntu/steps/licensing_method.sh) and activates with `-manualLicenseFile` alone; email and
# password are only a fallback there, used when the .ulf fails with "Machine bindings don't match". The owner signs in to
# Unity with Google and has no Unity password, so the .ulf alone must be enough to run. Without any of these the `plan`
# job reports "skipped: no Unity licence secret" and every Unity job is skipped cleanly (green, ~10 s).
#
# Safety: `pull_request` only (never pull_request_target), so a fork's PR gets no secrets; Unity jobs also refuse
# fork PRs explicitly. Permissions are read-only except check runs for the test report.
#
# ci/playmode-triage (2026-11-13, panel P-01..P-11): GitHub runs PlayMode the way the Mac gate does
# (tools/unity-playtest.sh: -batchmode -nographics), in 3 parallel shards by fixture, with the NUnit category
# RequiresGpu excluded. A test that needs a real GPU (a rendered frame, a read-back) carries
# [Category("RequiresGpu")]; GitHub's runners have none (llvmpipe at best), the owner's Mac integrator still runs them
# (it passes no category exclusion). Wall-clock WAIT budgets in PlayMode tests scale by -cmTestTimeScale 4 here
# (TestClock in Runtime.PlayTests/SanityWorld.cs); product promises ("within a second") never scale.
# Input `graphics: software` runs PlayMode under the runner's llvmpipe OpenGL instead (diagnosis only: a batch-mode
# Editor never runs WaitForEndOfFrame, and renderers become visible, which -nographics never exercises).
# Speed: the Library cache is restored from any earlier key (main's caches are visible to every branch) and saved
# even when tests fail (actions/cache/save, always()), so a red run still warms the next one.
# Any branch: `gh workflow run unity-ci.yml --ref <branch> -f jobs=tests|all|...`; `jobs=all` runs EditMode, the 3
# PlayMode shards and the Windows and macOS players in parallel.
#
# Triggers: manual (loop/gates/remote editmode|playmode|tests|build-windows|build-mac|builds|all), and PRs to main only
# when the PR carries the label `ci:unity` or the repository variable UNITY_CI_ON_PR is 'true' (private-repo minutes
# are limited: about 60 to 100 Linux minutes for tests plus one build).
name: unity-ci
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which Unity jobs"
        type: choice
        options: [tests, editmode, playmode, build-windows, build-mac, builds, all]
        default: tests
      category:
        description: "NUnit category filter for EditMode and PlayMode (Unity syntax; '!Slow' = the per-batch set, 'Slow' = the slow suite). RequiresGpu is always excluded here."
        default: '!Slow'
      graphics:
        description: "PlayMode graphics: nographics (as the Mac gate) or software (llvmpipe OpenGL, diagnosis only)"
        type: choice
        options: [nographics, software]
        default: nographics
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
permissions:
  contents: read
  checks: write
concurrency:
  group: unity-ci-${{ github.ref }}-${{ inputs.jobs || 'pr' }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      editmode: ${{ steps.p.outputs.editmode }}
      playmode: ${{ steps.p.outputs.playmode }}
      build-windows: ${{ steps.p.outputs.build-windows }}
      build-mac: ${{ steps.p.outputs.build-mac }}
      category: ${{ steps.p.outputs.category }}
      graphics: ${{ steps.p.outputs.graphics }}
    steps:
      - id: p
        shell: bash
        env:
          HAS_LICENCE: ${{ secrets.UNITY_LICENSE != '' || (secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '') }}
          EVENT: ${{ github.event_name }}
          WANT: ${{ inputs.jobs || 'tests' }}
          CATEGORY: ${{ inputs.category || '!Slow' }}
          GRAPHICS: ${{ inputs.graphics || 'nographics' }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          LABELLED: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:unity') }}
          ON_PR: ${{ vars.UNITY_CI_ON_PR == 'true' }}
        run: |
          set -euo pipefail
          run=true; why=''
          if [ "$HAS_LICENCE" != true ]; then run=false; why='skipped: no Unity licence secret (UNITY_LICENSE, or UNITY_EMAIL and UNITY_PASSWORD)'; fi
          if [ "$EVENT" = pull_request ]; then
            if [ "$FORK" = true ]; then run=false; why='skipped: fork PR (no secrets for forks)'; fi
            if [ "$LABELLED" != true ] && { [ "$ON_PR" != true ] || [ "$DRAFT" = true ]; }; then run=false; why="${why:-skipped: PR without the ci:unity label (or UNITY_CI_ON_PR unset / draft)}"; fi
          fi
          e=false; p=false; w=false; m=false
          if [ "$run" = true ]; then
            case "$WANT" in
              tests) e=true; p=true ;;
              editmode) e=true ;;
              playmode) p=true ;;
              build-windows) w=true ;;
              build-mac) m=true ;;
              builds) w=true; m=true ;;
              all) e=true; p=true; w=true; m=true ;;
            esac
          fi
          { echo "editmode=$e"; echo "playmode=$p"; echo "build-windows=$w"; echo "build-mac=$m"; echo "category=$CATEGORY"; echo "graphics=$GRAPHICS"; } >> "$GITHUB_OUTPUT"
          echo "### unity-ci plan" >> "$GITHUB_STEP_SUMMARY"
          echo "editmode=$e playmode=$p build-windows=$w build-mac=$m category='$CATEGORY' graphics=$GRAPHICS ${why}" | tee -a "$GITHUB_STEP_SUMMARY"

  tests:
    needs: plan
    if: needs.plan.outputs.editmode == 'true' || needs.plan.outputs.playmode == 'true'
    name: tests (${{ matrix.mode }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # PlayMode shards by fixture (run 43451229397 durations, 1312 s in all): 1 = HumanControl + BigMoments (414 s),
        # 2 = GameFlow + GameplaySanity + AnimationPass + TechHardening (452 s), 3 = every other fixture (446 s). Shard 3
        # is "not 1 and not 2", so a new fixture always runs somewhere. -testFilter values are regexes on the full name.
        include:
          - mode: EditMode
            shard: ''
            filter: ''
          - mode: PlayMode
            shard: '1of3'
            filter: '^CriticalMass.Runtime.PlayTests.HumanControlPlayTests.;^CriticalMass.Runtime.PlayTests.BigMomentsPlayTests.'
          - mode: PlayMode
            shard: '2of3'
            filter: '^CriticalMass.Runtime.PlayTests.GameFlowPlayTests.;^CriticalMass.Runtime.PlayTests.GameplaySanityPlayTests.;^CriticalMass.Runtime.PlayTests.AnimationPassPlayTests.;^CriticalMass.Runtime.PlayTests.TechHardeningPlayTests.'
          - mode: PlayMode
            shard: '3of3'
            filter: '!^CriticalMass.Runtime.PlayTests.HumanControlPlayTests.;!^CriticalMass.Runtime.PlayTests.BigMomentsPlayTests.;!^CriticalMass.Runtime.PlayTests.GameFlowPlayTests.;!^CriticalMass.Runtime.PlayTests.GameplaySanityPlayTests.;!^CriticalMass.Runtime.PlayTests.AnimationPassPlayTests.;!^CriticalMass.Runtime.PlayTests.TechHardeningPlayTests.'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Skip the mode that was not asked for
        id: want
        shell: bash
        run: |
          w=false
          [ "${{ matrix.mode }}" = EditMode ] && [ "${{ needs.plan.outputs.editmode }}" = true ] && w=true
          [ "${{ matrix.mode }}" = PlayMode ] && [ "${{ needs.plan.outputs.playmode }}" = true ] && w=true
          echo "run=$w" >> "$GITHUB_OUTPUT"
          # The Unity arguments (no spaces inside a value: the runner splits customParameters on whitespace).
          p="-testCategory ${{ needs.plan.outputs.category }};!RequiresGpu -cmTestTimeScale 4"
          [ -n "${{ matrix.filter }}" ] && p="$p -testFilter ${{ matrix.filter }}"
          [ "${{ matrix.mode }}" = PlayMode ] && [ "${{ needs.plan.outputs.graphics }}" = nographics ] && p="$p -nographics"
          echo "params=$p" >> "$GITHUB_OUTPUT"
          echo "unity params: $p"
      - name: Free disk only when short (the editor image is ~5.3 GB, Library ~3.6 GB; the rm took 1.4 to 4.5 min)
        if: steps.want.outputs.run == 'true'
        run: |
          avail=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          echo "free: ${avail} GB"
          if [ "$avail" -lt 30 ]; then sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /; fi
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
        with:
          lfs: true
      - uses: actions/cache/restore@v4
        id: lib
        if: steps.want.outputs.run == 'true'
        with:
          path: Library
          key: Library-editor-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-editor-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-editor-
      - name: Library cache
        if: steps.want.outputs.run == 'true'
        run: echo "Library cache hit=${{ steps.lib.outputs.cache-hit }} restored=${{ steps.lib.outputs.cache-matched-key || 'none (cold import)' }}"
      - uses: game-ci/unity-test-runner@v4
        if: steps.want.outputs.run == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: ${{ matrix.mode }}
          customParameters: ${{ steps.want.outputs.params }}
          # No `coverageEnabled: false`: unity-test-runner@v4.4.0 turns it into `--no-coverageEnabled`, and game-ci CLI
          # v0.1.74 parses with "negation-prefix": false under strict mode, so the run dies in 1 s with
          # "Unknown argument: noCoverageEnabled" (run 43450423341). The default (true) passes no such flag.
          artifactsPath: artifacts/${{ matrix.mode }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: ${{ matrix.mode }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }} results
      # Saved even when tests fail (actions/cache saves only on success, so run 43451229397's PlayMode Library was lost).
      # One key per commit: the first job to finish saves it, the others' "already exists" is not an error. The key is the
      # one computed BEFORE Unity ran (cache-primary-key): Unity rewrites packages-lock.json during the run, so a
      # hashFiles() here hashed differently (run 43458773839 saved under 27b243.. while restoring ab61dd..).
      - uses: actions/cache/save@v4
        if: always() && steps.want.outputs.run == 'true' && steps.lib.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          path: Library
          key: ${{ steps.lib.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.want.outputs.run == 'true'
        with:
          name: unity-${{ matrix.mode }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}-results
          path: artifacts/${{ matrix.mode }}
          if-no-files-found: warn
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.build-windows == 'true' || needs.plan.outputs.build-mac == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: StandaloneWindows64
            method: CriticalMass.Editor.Build.Windows
            out: Builds/Windows
            want: build-windows
          - target: StandaloneOSX
            method: CriticalMass.Editor.Build.MacOS
            out: Builds/macOS
            want: build-mac
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Skip the target that was not asked for
        id: want
        shell: bash
        run: echo "run=${{ matrix.want == 'build-windows' && needs.plan.outputs.build-windows || needs.plan.outputs.build-mac }}" >> "$GITHUB_OUTPUT"
      - name: Free disk
        if: steps.want.outputs.run == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
        with:
          lfs: true
          fetch-depth: 0   # polish-audit-1: the build stamp's commit count (BuildInfo) needs the full history
      - name: Build stamp (commit and count for BuildInfo; git can fail inside the build container)
        id: stamp
        if: steps.want.outputs.run == 'true'
        shell: bash
        run: |
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.want.outputs.run == 'true'
        with:
          path: Library
          key: Library-${{ matrix.target }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.sha }}
          restore-keys: |
            Library-${{ matrix.target }}-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-${{ matrix.target }}-
            Library-editor-
      - uses: game-ci/unity-builder@v4
        if: steps.want.outputs.run == 'true'
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: ${{ matrix.target }}
          buildMethod: ${{ matrix.method }}
          versioning: None
          allowDirtyBuild: true
          customParameters: -buildCommit ${{ steps.stamp.outputs.sha }} -buildCount ${{ steps.stamp.outputs.count }}
      - name: Pack the player (tar keeps the macOS app's permissions)
        if: steps.want.outputs.run == 'true'
        run: sudo tar -C "${{ matrix.out }}" -czf "player-${{ matrix.target }}.tgz" .
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.run == 'true'
        with:
          name: player-${{ matrix.target }}
          path: player-${{ matrix.target }}.tgz
          retention-days: 7

  # polish-audit-1 (2026-11-13): the cheapest real Windows test we have without a Windows PC. A GitHub windows-latest
  # runner (Windows Server, no GPU: Direct3D 11 runs on Microsoft's WARP software rasteriser) unpacks the player built
  # above and runs tools/windows-run.ps1, the same script the owner's PC test uses. Pass A (-batchmode -nographics, one
  # autoplay match at 8x) proves the player starts, loads, plays and quits on Windows. Pass B (a real D3D11 window at
  # 1280x720, screenshots) is best effort on WARP and never fails the run; its log and screenshots are uploaded either way.
  # Pass B also traces the Direct3D 11 shader warm-up states (-Trace): the game ships no warm-up file for any API yet
  # (Assets/StreamingAssets/ShaderWarmup is absent), and this is the one D3D11 device we have.
  smoke-windows:
    needs: [plan, build]
    if: needs.plan.outputs.build-windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/windows-run.ps1
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: player-StandaloneWindows64
      - name: Unpack the player
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path player | Out-Null
          tar -xzf player-StandaloneWindows64.tgz -C player
          Copy-Item tools/windows-run.ps1 player/
          Get-ChildItem player | Format-Table Name, Length
          $mb = [math]::Round(((Get-ChildItem player -Recurse | Measure-Object Length -Sum).Sum / 1MB), 1)
          "player size: $mb MB" | Tee-Object -FilePath player-size.txt
          Get-ChildItem player -Recurse -Include *.exe | Select-Object FullName | Tee-Object -FilePath player-exes.txt
      - name: Pass A (logic, no window)
        id: passa
        shell: pwsh
        timeout-minutes: 25
        working-directory: player
        run: powershell -ExecutionPolicy Bypass -File .\windows-run.ps1 -SkipB
      - name: Pass B (Direct3D 11 window on WARP, best effort)
        if: always()
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 25
        working-directory: player
        run: |
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table
          powershell -ExecutionPolicy Bypass -File .\windows-run.ps1 -Quick -Trace
          Get-ChildItem -Recurse -Filter *.graphicsstate | Select-Object FullName, Length | Format-Table
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: |
            player/test-*
            player-size.txt
            player-exes.txt
          if-no-files-found: warn
          retention-days: 7
