# AUDIT ONLY (audit/mechanics-2026-11-21): the mechanics audit's measurement arms. Probe branch, never merged.
name: balance-report
on:
  push:
    branches: ['ci/balance/audit-mech-**']
permissions:
  contents: read
jobs:
  arms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { job: j01, arms: "approvedA|--seeds 72 --no-duels --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.TrailThresholdSeconds=15 --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8\nrally125|--seeds 72 --no-duels --set Depth.Comeback.RallyPerMille=250" }
          - { job: j02, arms: "floor50|--seeds 72 --no-duels --set Depth.Comeback.HoldMinPerMille=500\nnorally-floor50|--seeds 72 --no-duels --set Depth.Comeback.RallyOn=false --set Depth.Comeback.HoldMinPerMille=500" }
          - { job: j03, arms: "fwdTrailOnly|--seeds 72 --no-duels --set Depth.Comeback.ForwardWhenHillLost=false\nrally125-fwdTrail|--seeds 72 --no-duels --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.ForwardWhenHillLost=false" }
          - { job: j04, arms: "kaijuRef|--seeds 72 --no-duels --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04\nnoHealerFocus|--seeds 72 --no-duels --set Depth.BotBrain.TargetHealersFirst=false" }
          - { job: j05, arms: "quick5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120\nquick8|--team-size 8 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
          - { job: j06, arms: "quick5-nocomeback|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Comeback.Enabled=false\nquick5-idle|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --idle" }
          - { job: j07, arms: "quick5-approvedA|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.TrailThresholdSeconds=15 --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8\nquick5-norally|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Comeback.RallyOn=false" }
          - { job: j08, arms: "allFarmer-A|--seeds 72 --no-duels --mix-team Azure --mix 0,16,0,0,0,0\nallFarmer-C|--seeds 72 --no-duels --mix-team Crimson --mix 0,16,0,0,0,0" }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Arms
        shell: bash
        run: printf "${{ matrix.arms }}\n" | tools/balance/audit-arms.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.job }}
          path: |
            Temp/balance/arms/
            Temp/balance/build.log
          if-no-files-found: warn
          retention-days: 30
