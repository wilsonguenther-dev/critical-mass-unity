# b16 duel-order lever search (ci/balance/b16-* only; NEVER merge this workflow): job 1 plays the duel tables of every lever
# combination of tools/balance/b16-arms.py (32 shards, no matches); job 2 keeps the arms whose duel order holds, ranks them
# by lever cost and plays the cheapest at 72 seeds (both Warrior speed arms, plus the Warrior trade arms), each compared
# with the game as shipped (no switches = aa2ecfef rules) measured on the same runner.
name: balance-report
on:
  push:
    branches: ['ci/balance/**']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: balance-report-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Duel sweep
        shell: bash
        run: |
          set -o pipefail
          tools/balance/balance-report.sh tuning-index --out Temp/balance/ti.md >/dev/null || { cat Temp/balance/build.log | tail -40; exit 2; }
          DLL=tools/ci/BalanceReport/bin/Release/net8.0/balance-report.dll
          mkdir -p Temp/b16/sweep
          python3 tools/balance/b16-arms.py grid Temp/b16/arms.tsv
          wc -l Temp/b16/arms.tsv
          for p in 0 1 2 3; do
            s=$(( ${{ matrix.job }} * 4 + p ))
            dotnet $DLL duel-sweep --arms Temp/b16/arms.tsv --shard $s/32 --duel-reps 4 --out Temp/b16/sweep/shard-$s.csv > Temp/b16/sweep-$s.log 2>&1 &
          done
          wait
          tail -n 2 Temp/b16/sweep-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b16-sweep-${{ matrix.job }}
          path: |
            Temp/b16/sweep/
            Temp/balance/ti.md
          retention-days: 30
  arms:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { lfs: false }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - uses: actions/download-artifact@v4
        with: { path: Temp/b16/sweep, pattern: 'b16-sweep-*' }
      - name: Pick and play the arms at 72 seeds
        shell: bash
        run: |
          set -o pipefail
          tools/balance/balance-report.sh tuning-index --out Temp/balance/ti.md >/dev/null || { tail -40 Temp/balance/build.log; exit 2; }
          DLL=tools/ci/BalanceReport/bin/Release/net8.0/balance-report.dll
          python3 tools/balance/b16-arms.py pick Temp/b16/sweep Temp/b16/picked.tsv 4 | tee Temp/b16/pick.log
          cat Temp/b16/picked.tsv
          : > Temp/b16/cmds.txt
          while IFS=$'\t' read -r nm sw; do
            sets=""
            IFS=';' read -ra parts <<< "$sw"
            for p in "${parts[@]}"; do [[ -n "${p// }" ]] && sets="$sets --set '$p'"; done
            echo "dotnet $DLL run --seeds 72 --duel-reps 8 $sets --label $nm --out Temp/b16/run/$nm > Temp/b16/run-$nm.log 2>&1" >> Temp/b16/cmds.txt
          done < Temp/b16/picked.tsv
          mkdir -p Temp/b16/run
          xargs -d '\n' -P 4 -I{} bash -c '{}' < Temp/b16/cmds.txt
          for d in Temp/b16/run/*/; do
            n=$(basename "$d"); [[ "$n" == base ]] && continue
            dotnet $DLL compare --base Temp/b16/run/base/balance-report.json --head "$d/balance-report.json" --out "Temp/b16/cmp/$n" > "Temp/b16/cmp-$n.log" 2>&1
          done
          python3 tools/balance/b16-arms.py table Temp/b16/run/*/ | tee Temp/b16/table.md
          { echo "### b16 arms (72 seeds)"; cat Temp/b16/pick.log; echo; cat Temp/b16/table.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b16-arms
          path: |
            Temp/b16/
          retention-days: 30
