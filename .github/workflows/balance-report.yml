# AUDIT ONLY (audit/mechanics-2026-11-21): the mechanics audit's measurement arms. Probe branch, never merged.
name: balance-report
on:
  push:
    branches: ['ci/balance/audit-mech-**']
permissions:
  contents: read
jobs:
  arms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { job: j01, arms: "combo1|--seeds 72 --no-duels --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.ForwardWhenHillLost=false --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8\ncombo2|--seeds 72 --no-duels --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.ForwardWhenHillLost=false --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8 --set Depth.Comeback.TrailThresholdSeconds=15" }
          - { job: j02, arms: "combo1-q5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.ForwardWhenHillLost=false --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8\ncombo1-q8|--team-size 8 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.ForwardWhenHillLost=false --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8" }
          - { job: j03, arms: "kaijuRef2|--seeds 72 --no-duels --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.3\nkeepout7|--seeds 72 --no-duels --set Depth.Build.HillKeepout=7" }
          - { job: j04, arms: "plus2Healer-A|--seeds 72 --no-duels --mix-team Azure --mix 3,4,2,2,1,4\nplus2Healer-C|--seeds 72 --no-duels --mix-team Crimson --mix 3,4,2,2,1,4" }
          - { job: j05, arms: "nextbuild|--seeds 72 --no-duels --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.ForwardWhenHillLost=false --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8 --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.3 --set Depth.Build.HillKeepout=7\nnextbuild-q5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Comeback.RallyPerMille=250 --set Depth.Comeback.BonusCapSeconds=45 --set Depth.Comeback.ForwardWhenHillLost=false --set Depth.Comeback.RespawnStartSeconds=3 --set Depth.Comeback.RespawnEndSeconds=8 --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.3 --set Depth.Build.HillKeepout=7" }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Arms
        shell: bash
        run: printf "${{ matrix.arms }}\n" | tools/balance/audit-arms.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.job }}
          path: |
            Temp/balance/arms/
            Temp/balance/build.log
          if-no-files-found: warn
          retention-days: 30
