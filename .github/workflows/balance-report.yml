# PROBE ONLY (feat/b16-mechanics-fixes): the b16 measurement arms and the 72-seed compares vs aa2ecfef. Never merged.
name: balance-report
on:
  push:
    branches: ['ci/balance/b16-mech-**']
permissions:
  contents: read
jobs:
  arms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { job: c16, arms: "cmp-16|--seeds 72" }
          - { job: c08, arms: "cmp-08|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
          - { job: c05, arms: "cmp-05|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
          - { job: a01, arms: "heal-on|--seeds 72 --no-duels --set Depth.Mech.HealerTieBreak=true" }
          - { job: a02, arms: "warrior1|--seeds 72 --no-duels --set Depth.Mech.WarriorHoldWeight=1" }
          - { job: a03, arms: "nocap|--seeds 72 --no-duels --set Depth.Mech.HillContributorCap=0" }
          - { job: a04, arms: "allFarmer-A|--seeds 72 --no-duels --mix-team Azure --mix 0,16,0,0,0,0" }
          - { job: a05, arms: "noWarrior-A|--seeds 72 --no-duels --mix-team Azure --mix 0,6,3,3,2,2" }
          - { job: a06, arms: "allWarrior-A|--seeds 72 --no-duels --mix-team Azure --mix 16,0,0,0,0,0" }
          - { job: a07, arms: "idle16|--seeds 72 --no-duels --idle" }
          - { job: a08, arms: "quick5-idle|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --idle\nquick5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
          - { job: a09, arms: "heal-on-q5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HealerTieBreak=true\nheal-off-q5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
          - { job: a10, arms: "heal-on-q8|--team-size 8 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HealerTieBreak=true\nheal-off-q8|--team-size 8 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
    timeout-minutes: 120
    env:
      BASE_REF: aa2ecfef
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Arms
        shell: bash
        run: printf "${{ matrix.arms }}\n" | tools/balance/b16-arms.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b16-${{ matrix.job }}
          path: |
            Temp/balance/arms/
            Temp/balance/build.log
          if-no-files-found: warn
          retention-days: 30
