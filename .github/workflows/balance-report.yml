# AUDIT ONLY (audit/mechanics-2026-11-21): the mechanics audit's measurement arms. Probe branch, never merged.
name: balance-report
on:
  push:
    branches: ['ci/balance/audit-mech-**']
permissions:
  contents: read
jobs:
  arms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { job: j01, arms: "kr112|--seeds 72 --no-duels --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.12" }
          - { job: j02, arms: "kr112-q5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.12" }
          - { job: j03, arms: "kr112-q8|--team-size 8 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.12" }
          - { job: j04, arms: "kr118|--seeds 72 --no-duels --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.18" }
          - { job: j05, arms: "kr118-q5|--team-size 5 --seeds 200 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.KaijuTypes.RefShare=0.76,0.17,0.03,0.04 --set Depth.KaijuTypes.ElderBelowScore=1.18" }
          - { job: j06, arms: "quick8-400|--team-size 8 --seeds 400 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Arms
        shell: bash
        run: printf "${{ matrix.arms }}\n" | tools/balance/audit-arms.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.job }}
          path: |
            Temp/balance/arms/
            Temp/balance/build.log
          if-no-files-found: warn
          retention-days: 30
