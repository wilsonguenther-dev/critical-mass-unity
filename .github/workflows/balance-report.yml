# PROBE ONLY (batch 16 combine, ci/balance/b16-combined*): the 72-seed compares of the combined rules vs aa2ecfef (1.0.1356)
# at 16v16, 8v8 and 5v5, plus lever arms. Never merged.
name: balance-report
on:
  push:
    branches: ['ci/balance/b16-combined**']
permissions:
  contents: read
jobs:
  arms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { job: c16, arms: "cmp-16|--seeds 72" }
          - { job: c08, arms: "cmp-08|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
          - { job: c05, arms: "cmp-05|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120" }
          - { job: f08, arms: "f08-flatcap|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HillCapScalesWithSize=false" }
          - { job: f05, arms: "f05-flatcap|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HillCapScalesWithSize=false" }
          - { job: g08, arms: "g08-flatcap-feedold|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HillCapScalesWithSize=false --set Depth.Mech.FeedExtrasShare=false" }
          - { job: g05, arms: "g05-flatcap-feedold|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HillCapScalesWithSize=false --set Depth.Mech.FeedExtrasShare=false" }
          - { job: w1, arms: "w16-outn15|--seeds 72 --set Depth.CombatFeel.OutnumberedSeconds=1.5" }
          - { job: w2, arms: "w16-dmg23|--seeds 72 --set Depth.CombatFeel.Classes[0].AttackDamage=23" }
    timeout-minutes: 120
    env:
      BASE_REF: aa2ecfef
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Arms
        shell: bash
        run: printf "${{ matrix.arms }}\n" | tools/balance/b16-arms.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b16-${{ matrix.job }}
          path: |
            Temp/balance/arms/
            Temp/balance/build.log
          if-no-files-found: warn
          retention-days: 30
