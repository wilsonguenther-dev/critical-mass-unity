# AUDIT ONLY (audit/mechanics-2026-11-21): the mechanics audit's measurement arms. Probe branch, never merged.
name: balance-report
on:
  push:
    branches: ['ci/balance/audit-mech-**']
permissions:
  contents: read
jobs:
  arms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - { job: j01, arms: "control|--seeds 72\ncontrol5|--team-size 5 --seeds 200 --no-duels" }
          - { job: j02, arms: "idle16|--seeds 72 --no-duels --idle\nidle16-nohold|--seeds 72 --no-duels --idle --set Depth.Comeback.HoldFatigueOn=false\nidle16-norally|--seeds 72 --no-duels --idle --set Depth.Comeback.RallyOn=false" }
          - { job: j03, arms: "idle16-noforward|--seeds 72 --no-duels --idle --set Depth.Comeback.ForwardReturnOn=false\nidle16-nocomeback|--seeds 72 --no-duels --idle --set Depth.Comeback.Enabled=false\nidle16-nocurve|--seeds 72 --no-duels --idle --set Depth.Comeback.RespawnCurveOn=false" }
          - { job: j04, arms: "idle5|--team-size 5 --seeds 200 --no-duels --idle\nidle5-nohold|--team-size 5 --seeds 200 --no-duels --idle --set Depth.Comeback.HoldFatigueOn=false\nidle5-norally|--team-size 5 --seeds 200 --no-duels --idle --set Depth.Comeback.RallyOn=false" }
          - { job: j05, arms: "idle5-noforward|--team-size 5 --seeds 200 --no-duels --idle --set Depth.Comeback.ForwardReturnOn=false\nidle5-nocomeback|--team-size 5 --seeds 200 --no-duels --idle --set Depth.Comeback.Enabled=false\nidle5-nocurve|--team-size 5 --seeds 200 --no-duels --idle --set Depth.Comeback.RespawnCurveOn=false" }
          - { job: j06, arms: "nohold|--seeds 72 --no-duels --set Depth.Comeback.HoldFatigueOn=false\nnorally|--seeds 72 --no-duels --set Depth.Comeback.RallyOn=false" }
          - { job: j07, arms: "noforward|--seeds 72 --no-duels --set Depth.Comeback.ForwardReturnOn=false\nnocurve|--seeds 72 --no-duels --set Depth.Comeback.RespawnCurveOn=false" }
          - { job: j08, arms: "nohillrule|--seeds 72 --no-duels --set Depth.Comeback.KaijuHillPerMille=1000\nnocomeback|--seeds 72 --no-duels --set Depth.Comeback.Enabled=false" }
          - { job: j09, arms: "nohutchoices|--seeds 72 --no-duels --set Depth.HutChoices.Enabled=false\nnohut|--seeds 72 --no-duels --set Depth.Hut.On=false" }
          - { job: j10, arms: "nokaiju|--seeds 72 --no-duels --set HatchSeconds=100000\nnoterrain|--seeds 72 --no-duels --set Depth.TerrainHeight.Enabled=false\nnowalls|--seeds 72 --no-duels --set Depth.Build.On=false" }
          - { job: j11, arms: "noHealer-A|--seeds 72 --no-duels --mix-team Azure --mix 7,4,2,2,1,0\nnoHealer-C|--seeds 72 --no-duels --mix-team Crimson --mix 7,4,2,2,1,0\nnoBuilder-A|--seeds 72 --no-duels --mix-team Azure --mix 6,4,2,2,0,2" }
          - { job: j12, arms: "noBuilder-C|--seeds 72 --no-duels --mix-team Crimson --mix 6,4,2,2,0,2\nnoMiner-A|--seeds 72 --no-duels --mix-team Azure --mix 7,4,0,2,1,2\nnoMiner-C|--seeds 72 --no-duels --mix-team Crimson --mix 7,4,0,2,1,2" }
          - { job: j13, arms: "noDemo-A|--seeds 72 --no-duels --mix-team Azure --mix 7,4,2,0,1,2\nnoDemo-C|--seeds 72 --no-duels --mix-team Crimson --mix 7,4,2,0,1,2\nnoFarmer-A|--seeds 72 --no-duels --mix-team Azure --mix 9,0,2,2,1,2" }
          - { job: j14, arms: "noFarmer-C|--seeds 72 --no-duels --mix-team Crimson --mix 9,0,2,2,1,2\nnoWarrior-A|--seeds 72 --no-duels --mix-team Azure --mix 0,9,2,2,1,2\nnoWarrior-C|--seeds 72 --no-duels --mix-team Crimson --mix 0,9,2,2,1,2" }
          - { job: j15, arms: "plusHealer-A|--seeds 72 --no-duels --mix-team Azure --mix 4,4,2,2,1,3\nplusHealer-C|--seeds 72 --no-duels --mix-team Crimson --mix 4,4,2,2,1,3\nplusBuilder-A|--seeds 72 --no-duels --mix-team Azure --mix 4,4,2,2,2,2" }
          - { job: j16, arms: "plusBuilder-C|--seeds 72 --no-duels --mix-team Crimson --mix 4,4,2,2,2,2\nplusMiner-A|--seeds 72 --no-duels --mix-team Azure --mix 4,4,3,2,1,2\nplusMiner-C|--seeds 72 --no-duels --mix-team Crimson --mix 4,4,3,2,1,2" }
          - { job: j17, arms: "plusDemo-A|--seeds 72 --no-duels --mix-team Azure --mix 4,4,2,3,1,2\nplusDemo-C|--seeds 72 --no-duels --mix-team Crimson --mix 4,4,2,3,1,2\nplusFarmer-A|--seeds 72 --no-duels --mix-team Azure --mix 4,5,2,2,1,2" }
          - { job: j18, arms: "plusFarmer-C|--seeds 72 --no-duels --mix-team Crimson --mix 4,5,2,2,1,2\nplusWarrior-A|--seeds 72 --no-duels --mix-team Azure --mix 6,3,2,2,1,2\nplusWarrior-C|--seeds 72 --no-duels --mix-team Crimson --mix 6,3,2,2,1,2" }
          - { job: j19, arms: "allWarrior-A|--seeds 72 --no-duels --mix-team Azure --mix 16,0,0,0,0,0\nallWarrior-C|--seeds 72 --no-duels --mix-team Crimson --mix 16,0,0,0,0,0\nallDemo-A|--seeds 72 --no-duels --mix-team Azure --mix 0,0,0,16,0,0" }
          - { job: j20, arms: "allDemo-C|--seeds 72 --no-duels --mix-team Crimson --mix 0,0,0,16,0,0\nnofeed-A|--seeds 72 --no-duels --no-feed-team Azure\nnofeed-C|--seeds 72 --no-duels --no-feed-team Crimson" }
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Arms
        shell: bash
        run: printf "${{ matrix.arms }}\n" | tools/balance/audit-arms.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-${{ matrix.job }}
          path: |
            Temp/balance/arms/
            Temp/balance/build.log
          if-no-files-found: warn
          retention-days: 30
