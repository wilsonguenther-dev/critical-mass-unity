# PROBE ONLY (batch 16 combine, ci/balance/b16-combined*): the 72-seed compares of the combined rules vs aa2ecfef (1.0.1356)
# at 16v16, 8v8 and 5v5, plus lever arms. Never merged.
name: balance-report
on:
  push:
    branches: ['ci/balance/b16-combined**']
permissions:
  contents: read
jobs:
  arms:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 14
      matrix:
        include:
          - { job: d05-nocap, arms: "d05-nocap|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HillContributorCap=0" }
          - { job: d08-nocap, arms: "d08-nocap|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.HillContributorCap=0" }
          - { job: d05-w1, arms: "d05-w1|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.WarriorHoldWeight=1" }
          - { job: d08-w1, arms: "d08-w1|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.WarriorHoldWeight=1" }
          - { job: d05-kidleoff, arms: "d05-kidleoff|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.KaijuIdleOffHill=false" }
          - { job: d08-kidleoff, arms: "d08-kidleoff|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.KaijuIdleOffHill=false" }
          - { job: d05-feedold, arms: "d05-feedold|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.FeedExtrasShare=false" }
          - { job: d08-feedold, arms: "d08-feedold|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Mech.FeedExtrasShare=false" }
          - { job: d08-cbsmall8, arms: "d08-cbsmall8|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.Comeback.SmallTeamMaxSize=8" }
          - { job: d05-pfoff, arms: "d05-pfoff|--team-size 5 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.PhysicsFeel.Enabled=false" }
          - { job: d08-pfoff, arms: "d08-pfoff|--team-size 8 --seeds 72 --no-duels --set MatchSeconds=240 --set HatchSeconds=120 --set Depth.PhysicsFeel.Enabled=false" }
    timeout-minutes: 120
    env:
      BASE_REF: aa2ecfef
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Arms
        shell: bash
        run: printf "${{ matrix.arms }}\n" | tools/balance/b16-arms.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b16-${{ matrix.job }}
          path: |
            Temp/balance/arms/
            Temp/balance/build.log
          if-no-files-found: warn
          retention-days: 30
